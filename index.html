<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twilio SMS Gönderici</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #333; font-size: 28px; margin-bottom: 10px; }
        .header p { color: #666; font-size: 14px; }
        .icon { font-size: 48px; margin-bottom: 15px; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            color: #555;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            outline: none;
        }
        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        input::placeholder { color: #aaa; }
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102,126,234,0.3);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            animation: slideIn 0.3s ease;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .message.show { display: block; }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 12px;
            margin-top: 20px;
            border-radius: 5px;
            font-size: 12px;
            color: #555;
        }
        .info-box strong { color: #667eea; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">📱</div>
            <h1>SMS Gönderici</h1>
            <p>Twilio API ile anında mesaj gönderin</p>
        </div>

        <form id="smsForm">
            <div class="form-group">
                <label for="phone">Telefon Numarası</label>
                <input 
                    type="tel" 
                    id="phone" 
                    placeholder="905551234567" 
                    required
                    pattern="^\d{10,15}$"
                    title="Lütfen geçerli bir telefon numarası girin"
                >
            </div>

            <button type="submit" class="btn" id="submitBtn">
                📨 SMS Gönder
            </button>
        </form>

        <div id="messageBox" class="message"></div>

        <div class="info-box">
            <strong>💡 Bilgi:</strong> Twilio Trial hesabında sadece doğrulanmış numaralara SMS gönderebilirsiniz. Numaranızı Twilio panelinde "Verified Caller IDs" bölümüne eklemeyi unutmayın.
        </div>
    </div>

    <script>
        // ✅ SİZİN WORKER URL'NİZ
        const WORKER_URL = 'https://empty-firefly-af53.alyux.workers.dev';

        const form = document.getElementById('smsForm');
        const phoneInput = document.getElementById('phone');
        const submitBtn = document.getElementById('submitBtn');
        const messageBox = document.getElementById('messageBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = phoneInput.value.trim();

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Gönderiliyor...';
            messageBox.classList.remove('show', 'success', 'error');

            try {
                const response = await fetch(`${WORKER_URL}?numara=${phone}`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    showMessage('success', `✅ ${data.message} (SID: ${data.sid || 'N/A'})`);
                    phoneInput.value = '';
                } else {
                    showMessage('error', `❌ Hata: ${data.message || 'Bilinmeyen hata'}`);
                }
            } catch (error) {
                showMessage('error', `❌ Bağlantı hatası: ${error.message}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '📨 SMS Gönder';
            }
        });

        function showMessage(type, text) {
            messageBox.className = `message ${type} show`;
            messageBox.textContent = text;
            setTimeout(() => messageBox.classList.remove('show'), 5000);
        }

        phoneInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') form.dispatchEvent(new Event('submit'));
        });
    </script>
</body>
</html>
